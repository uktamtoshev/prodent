spring:
  datasource:
    # Testcontainers will override these via @DynamicPropertySource
    url: jdbc:tc:postgresql:17-alpine:///prodent
    username: prodent
    password: prodent

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none

  mail:
    host: localhost
    port: 25

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

app:
  jwt:
    secret: test-jwt-secret-key-minimum-32-chars-for-testing-only
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000

  cors:
    allowed-origins: http://localhost:3000

  rate-limit:
    otp-max-requests: 100
    otp-window-minutes: 1
    login-max-attempts: 100
    login-lock-minutes: 1

  sms:
    dry-run: true

  email:
    dry-run: true

logging:
  level:
    com.prodent: DEBUG
    org.hibernate.SQL: DEBUG
