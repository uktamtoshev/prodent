version: '3.9'
services:
  postgres:
    image: postgres:17-alpine
    container_name: prodent-db
    environment:
      POSTGRES_DB: prodent
      POSTGRES_USER: prodent
      POSTGRES_PASSWORD: prodent_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prodent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./prodent-backend
      dockerfile: Dockerfile
    container_name: prodent-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: prodent
      DB_USERNAME: prodent
      DB_PASSWORD: prodent_secret
      DB_POOL_SIZE: 20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-prodent-local-jwt-secret-2026-${RANDOM:-7f3e9a2b}-minimum-64-chars-padding-padding
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./prodent-frontend
      dockerfile: Dockerfile
    container_name: prodent-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
