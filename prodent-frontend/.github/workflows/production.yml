name: Manual frontend production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA that passed main CI and staging
        required: true
        type: string
      release_digest:
        description: "Exact sha256 digest recorded by that successful staging run"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  deploy_production:
    name: Verify staged digest and deploy frontend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: prodent-frontend-production
      cancel-in-progress: false
    steps:
      - id: staged_run
        name: Require a successful main CI and staging run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: |
          printf '%s' "${RELEASE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "${RELEASE_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          run_id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${RELEASE_SHA}" -f branch=main -f status=success -f per_page=20 \
            --jq '.workflow_runs[0].id // empty')
          test -n "${run_id}"
          printf 'run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Check out the exact approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download the artifact promoted to staging
        uses: actions/download-artifact@v4
        with:
          name: frontend-release-${{ inputs.release_sha }}
          path: expected-release
          run-id: ${{ steps.staged_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the exact staged image reference
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
        run: |
          expected_image="${IMAGE_REPOSITORY}@${RELEASE_DIGEST}"
          recorded_image=$(sed -n 's/^RELEASE_IMAGE=//p' expected-release/release.env)
          test "${recorded_image}" = "${expected_image}"
          printf 'RELEASE_IMAGE=%s\n' "${expected_image}" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image label against the approved commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          docker pull "${RELEASE_IMAGE}" >/dev/null
          actual_revision=$(docker image inspect "${RELEASE_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "${actual_revision}" = "${RELEASE_SHA}"

      - name: Prepare verified SSH identity
        env:
          SSH_PRIVATE_KEY_VALUE: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_VALUE: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "${RUNNER_TEMP}/prodent-ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY_VALUE}" > "${RUNNER_TEMP}/prodent-ssh/id"
          printf '%s\n' "${SSH_KNOWN_HOSTS_VALUE}" > "${RUNNER_TEMP}/prodent-ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/prodent-ssh/id" "${RUNNER_TEMP}/prodent-ssh/known_hosts"

      - name: Candidate check, external smoke and safe production switch
        env:
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/prodent-ssh/id
          SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/prodent-ssh/known_hosts
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          REGISTRY: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.RELEASE_IMAGE }}
          EXPECTED_REVISION: ${{ inputs.release_sha }}
          SERVICE_KIND: frontend
          SERVICE_NAME: prodent-frontend
          HOST_BIND: ${{ vars.FRONTEND_HOST_BIND || '127.0.0.1' }}
          HOST_PORT: ${{ vars.FRONTEND_HOST_PORT || '10240' }}
          ENV_FILE: '-'
          NETWORK: ${{ vars.PRODENT_NETWORK || 'prodent-network' }}
          UPLOADS_VOLUME: '-'
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_URL: ${{ vars.APP_URL }}
        run: ops/deploy/remote-deploy.sh > deploy-production.log 2>&1

      - name: Show deployment log
        if: always()
        run: test ! -f deploy-production.log || cat deploy-production.log

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-deploy-${{ inputs.release_sha }}
          path: deploy-production.log
          retention-days: 30
