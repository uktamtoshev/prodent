# Never write query strings to access logs: storage and OAuth URLs can carry
# short-lived credentials. Keep the original request path (before SPA rewrites)
# and strip query strings from Referer as well.
map $request_uri $access_log_path {
  ~^(?<request_path_without_query>[^?]*) $request_path_without_query;
}

map $http_referer $access_log_referer {
  "" "-";
  ~^(?<referer_without_query>[^?]*) $referer_without_query;
}

map $args $public_catalog_robots {
  ""      "index, follow";
  default "noindex, follow";
}

log_format prodent_no_query '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $access_log_path $server_protocol" '
                            '$status $body_bytes_sent '
                            '"$access_log_referer" "$http_user_agent"';

server {
  listen 8080;
  server_name _;

  # The same policy works when hashed assets move to the approved CDN. Runtime
  # data images stay HTTPS-only; scripts never allow eval.
  # Inline JSON-LD and the existing analytics bootstrap require unsafe-inline
  # until a nonce is issued at the edge. Eval stays forbidden and third-party
  # origins are listed explicitly instead of allowing arbitrary scripts.
  set $prodent_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.prodent.uz https://www.googletagmanager.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://cdn.prodent.uz https://rsms.me https://fonts.googleapis.com; font-src 'self' data: https://cdn.prodent.uz https://rsms.me https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.prodent.uz https://ipapi.co https://nominatim.openstreetmap.org https://www.google-analytics.com https://mc.yandex.ru wss:; frame-src 'self' https://www.youtube.com; media-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  add_header Content-Security-Policy $prodent_csp always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;

  # Server-level access_log replaces the base image's inherited "combined"
  # format instead of writing a second, unsafe copy of every request.
  access_log /var/log/nginx/access.log prodent_no_query;

  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints production assets, so these files can be cached forever.
  # HTML is handled separately and always revalidates.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files /index.html =404;
  }

  # Spring Boot backend API. Set BACKEND_HOST to the host:port of the
  # prodent-backend container (e.g. `prodent-backend:8080` if both
  # containers share a docker network; otherwise the host IP/port).
  # For local docker-compose this is `prodent-backend:8080`.
  set $backend_upstream "prodent-backend:8080";

  # Because proxy_pass uses a VARIABLE ($backend_upstream), nginx resolves the hostname
  # at REQUEST time, not startup — which requires an explicit resolver. Without it every
  # /api/ request 502s ("no resolver defined to resolve prodent-backend"). 127.0.0.11 is
  # Docker's embedded DNS; short TTL so a backend container recreate (new IP) is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Public share-link resolver accepts only a tiny JSON body. Keep this exact
  # route stricter than the general API upload limit and reject oversized
  # requests before Spring parses them.
  location = /api/v1/public/treatment-plans/resolve {
    client_max_body_size 1k;

    proxy_pass         http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_redirect     off;

    # Replace upstream values instead of combining duplicate security headers.
    # Keep Pragma from Spring unchanged for legacy no-cache clients.
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Robots-Tag;

    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy $prodent_csp always;
  }

  # /api/v1/** — REST + auth + OAuth redirect chain.
  location /api/ {
    proxy_pass         http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    # OAuth callback chain returns 302 — don't follow, just forward.
    proxy_redirect     off;
    # Large multipart uploads (avatars, portfolio) — bump limits.
    client_max_body_size 32M;
    proxy_read_timeout 120s;
  }

  # Spring Boot actuator (health checks, metrics) — proxy too.
  location /actuator/ {
    proxy_pass         http://$backend_upstream;
    proxy_set_header   Host $host;
  }

  # WebSocket for chat / live updates.
  location /ws/ {
    proxy_pass         http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 3600s;
  }

  # Blog cover images live on the backend (src/main/resources/static/blog-covers).
  # Without this they fall through to the SPA try_files and return index.html
  # (broken <img> on /articles). Proxy them to the backend.
  location /blog-covers/ {
    proxy_pass       http://$backend_upstream;
    proxy_set_header Host $host;
  }

  # Dynamic sitemap (doctors/clinics/articles) is generated by the backend.
  # Serve it from there instead of the stale static public/sitemap.xml.
  location = /sitemap.xml {
    proxy_pass       http://$backend_upstream;
    proxy_set_header Host $host;
  }

  # Public treatment-plan links keep their bearer token in the URL fragment.
  # Protect the SPA document itself from caching, indexing and referrer leaks.
  location = /treatment-plan {
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, private" always;
    add_header Content-Security-Policy $prodent_csp always;
    # Use an existing file candidate instead of a fallback URI. A fallback URI
    # causes an internal redirect into `location /` and drops these headers.
    try_files /index.html =404;
  }

  # Important public routes receive route-specific title, description, Open
  # Graph and canonical tags before JavaScript starts. The React application
  # still mounts normally from the same immutable asset files.
  location = / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files /prerender/home.html /index.html;
  }

  location = /search {
    add_header X-Robots-Tag $public_catalog_robots always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files /prerender/search.html /index.html;
  }

  location = /clinics {
    add_header X-Robots-Tag $public_catalog_robots always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files /prerender/clinics.html /index.html;
  }

  location = /promotions {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files /prerender/promotions.html /index.html;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $prodent_csp always;
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
